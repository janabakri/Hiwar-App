  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  dio: ^5.3.3
  provider: ^6.0.5
  shared_preferences: ^2.2.2
  flutter_secure_storage: ^9.2.2
